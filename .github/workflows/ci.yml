name: Secure CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      # 使用官方bandit action，避开pbr依赖坑
      - name: Run SAST Bandit scan
        uses: PyCQA/bandit-action@v1
        with:
          args: -r . -f json -o bandit_report.json

      # SCA依赖漏洞扫描 safety
      - name: Run SCA safety check
        run: safety check

