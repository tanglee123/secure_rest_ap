name: Secure CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
	  pip install -r requirements.txt pbr setuptools==66.0.0 bandit safety
          bandit --version
          pip list | grep -E "bandit|pbr|setuptools|safety"

      # SAST静态代码扫描 bandit
      # || true: 就算bandit扫出漏洞，也不终止CI流水线，仅输出报告
      - name: Run SAST Bandit scan
        run: bandit -r . -f json -o bandit_report.json || true

      # SCA依赖漏洞扫描 safety
      # || true: safety发现漏洞也不把CI标红
      - name: Run SCA safety check
        run: safety check || true

