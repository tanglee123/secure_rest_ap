name: Secure CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pbr bandit safety
          bandit --version
          pip list | grep -E "bandit|pbr|setuptools|safety"

      # SAST静态代码扫描 bandit
      # || true: bandit找到漏洞也不会终止CI流水线，仅输出报告
      - name: Run SAST Bandit scan
        run: bandit -r . -f json -o bandit_report.json || true

      - name: Run SCA Snyk scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: snyk-report
          path: snyk.sarif
