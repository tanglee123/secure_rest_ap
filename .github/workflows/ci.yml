name: Secure CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pbr bandit safety
          bandit --version
          pip list | grep -E "bandit|pbr|setuptools|safety"

      # SAST静态代码扫描 bandit
      # || true: bandit找到漏洞也不会终止CI流水线，仅输出报告
      - name: Run SAST Bandit scan
        run: bandit -r . -f json -o bandit_report.json || true

      # SCA依赖漏洞扫描 safety
      # --disable-auth：关闭safety交互式登录，CI环境正常运行
      # || true：safety检出漏洞不把CI标红
      - name: Run SCA safety check
        run: safety scan --disable-auth || true

